apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-important-dates-settings
spec:
  forms:
    - group: reminder
      label: 提醒设置
      formSchema:
        - $formkit: number
          name: remindDays
          label: 提前提醒天数
          value: 3
          validation: required|Number
          help: 距到期 N 天内显示提醒（含当天，0 表示仅当天提醒）
        - $formkit: checkbox
          name: backendReminder
          label: 后台提醒
          value: true
          help: 在后台「重要日期」页面顶部显示到期提醒
        - $formkit: checkbox
          name: frontendReminder
          label: 前台提醒
          value: true
          help: 在前台 /important-dates 页面顶部显示到期提醒
        - $formkit: number
          name: overdueRemindDays
          label: 逾期后继续提醒天数
          value: 3
          min: 1
          max: 30
          help: 到期后仍会提醒几天（每天文案不同）。超过这个天数后转入「待处理」：不再主动提醒，但**一直保留在列表里**直到你点「已办」或「忽略」——不会被静默清掉。
        - $formkit: checkbox
          name: frontendShowOverdue
          label: 前台显示逾期项
          value: false
          help: 默认关闭：前台横幅与悬浮提示只显示"即将到期且未办理"的事项，逾期项只在后台可见（避免把"保险过期"这类信息公开给访客）。打开后前台也会显示逾期项。
        - $formkit: checkbox
          name: allowDismiss
          label: 允许逐条忽略提醒
          value: true
          help: 开启后，前台横幅与后台仪表盘小组件的每条提醒右侧会出现「✕」：点一次表示"本到期周期内不再提示"（状态存在访客/管理员的浏览器里，到期日变化后自动重新提醒）。关闭则只能整块显示。
        - $formkit: number
          name: toastCloseSeconds
          label: 悬浮提示自动关闭秒数
          value: 8
          validation: required|Number
          help: 全站悬浮提醒自动关闭时间（秒），0 = 不自动关闭（需手动点 ×）；自动关闭时弹窗内会显示倒计时与进度条
    - group: toast
      label: 全站悬浮提醒
      formSchema:
        - $formkit: checkbox
          name: toastEnabled
          label: 启用
          value: false
          help: 开启后插件自动在站点「系统设置 → 代码注入 → 全局 head 标签」维护一段脚本（只增删自己的片段，不影响其他注入内容；与主题无关、任何主题都会生效）：访问任意页面时浮出重要日期提醒，点 × 只关闭当前弹窗，刷新/换页会重新打开；自动关闭（按秒数）同样只收起当前弹窗；关闭后自动移除该脚本。
        - $formkit: select
          name: toastScope
          label: 显示范围
          value: PAGE
          options:
            - label: 仅「记得」页面（推荐：访客看不到你的提醒）
            - value: SITE
              label: 全站所有页面（含访客可见页面）
          help: 提醒内容每次实时获取；处于提醒节点时弹出一次（同一节点只弹一次，记录写库，换浏览器/设备都不会重置）。
        - $formkit: select
          name: toastPosition
          label: 弹窗位置
          value: bottom-right
          options:
            - label: 右下角
              value: bottom-right
            - label: 左下角
              value: bottom-left
            - label: 右上角
              value: top-right
            - label: 左上角
              value: top-left
            - label: 底部居中
              value: bottom-center
            - label: 屏幕中间
              value: center
          help: 电脑端按所选位置固定显示；移动端固定显示在底部居中
        - $formkit: text
          name: toastTitle
          label: 提醒标题
          value: 📅 重要日期提醒
          help: 弹窗标题文字
        - $formkit: textarea
          name: toastTemplate
          label: 提醒模板
          value: 「{title}」{whenText}（{dateText}）
          help: 每条提醒的显示模板，可用占位符：{title} 名称、{whenText} 贴心措辞（今天/明天/还有 N 天自动生成）、{daysUntil} 剩余天数、{dateText} 日期文本、{nextSolarDate} 下一次阳历日期
        - $formkit: text
          name: toastEmptyText
          label: 无提醒时文案
          value: 最近没有重要日期，生活照常美好～
          help: 没有到期提醒时弹窗显示的文案；留空则无提醒时不弹出
        - $formkit: select
          name: toastDefaultClose
          label: × 关闭默认行为
          value: once
          options:
            - label: 本次关闭（刷新/换页重新弹出）
              value: once
            - label: 1 天内不显示
              value: 1d
            - label: 3 天内不显示
              value: 3d
            - label: 7 天内不显示
              value: 7d
            - label: 10 天内不显示
              value: 10d
            - label: 30 天内不显示
              value: 30d
            - label: 永久关闭
              value: forever
          help: 访客点 × 后的默认关闭行为；开启「关闭方式菜单」时，点 × 会先弹出选择菜单，5 秒未选择则按此默认执行（本次关闭仅收起当前弹窗，不记任何状态）
        - $formkit: number
          name: toastMaxPerType
          label: 每类最多显示条数
          value: 2
          min: 1
          max: 5
          help: 悬浮弹窗中「重要日期」与「座驾到期」各自最多显示几条，超出的合并为一句提示（如：另有 2 项 7 天内到期）。
        - $formkit: checkbox
          name: toastCloseMenu
          label: 关闭方式菜单
          value: true
          help: 点 × 弹出「本次关闭 / 3 天内不显示 / 10 天内不显示 / 永久关闭」选择；关闭后直接按「× 关闭默认行为」执行。时长与永久记录在访客浏览器 localStorage，到期自动恢复（清浏览器站点数据可重置）
    - group: basic
      label: 展示设置
      formSchema:
        - $formkit: number
          name: dashboardPageSize
          label: 仪表盘每页条数
          value: 5
          min: 1
          max: 20
          help: 控制台仪表盘「记得 · 到期提醒」小组件每页显示几条（默认 5）。与前台/后台横幅使用同一份完整提醒，仅悬浮弹窗按"每类最多 N 条"降噪合并。
        - $formkit: checkbox
          name: dashboardPagination
          label: 仪表盘显示分页
          value: true
          help: 开启后小组件底部显示「‹ 1 / 3 ›」分页；关闭则只显示前 N 条。
        - $formkit: checkbox
          name: showImportantTag
          label: 前台显示"重要"标记
          value: true
          help: 在 /important-dates 页面为重要日期显示"重要"标记
    - group: privacy
      label: 隐私设置
      formSchema:
        - $formkit: checkbox
          name: showBirthday
          label: 前台展示生日
          value: false
          help: 默认关闭：前台（/important-dates 页面、主题模板、数据接口）中人员生日一律脱敏显示（如 1999-10-** / 腊月**）；开启后前台展示完整生日。后台管理端始终显示完整信息，不受影响。
        - $formkit: checkbox
          name: showAvatar
          label: 前台展示大头贴
          value: false
          help: 默认关闭：人员照片（大头贴）仅后台管理端显示；开启后前台（/important-dates 页面、主题模板）展示人员照片。照片本身属于敏感信息，关闭时前台不输出任何图片地址。
    - group: attachment
      label: 照片设置（大头贴 / 座驾相册）
      formSchema:
        - $formkit: select
          name: avatarGroupName
          label: 人员大头贴 · 分类（分组）
          value: ""
          options:
            - label: 不限定
              value: ""
          help: 人员大头贴专用的「分类」：选项实时取自站点附件库分组（系统分组变更即时更新）。「从附件库选择」默认只显示该分类，上传的大头贴也会存入该分类。
        - $formkit: select
          name: avatarPolicyName
          label: 人员大头贴 · 存储策略
          value: ""
          options:
            - label: 默认策略
              value: ""
          help: 人员大头贴专用的「存储策略」：选项实时取自站点存储策略。留空使用默认策略。
        - $formkit: select
          name: carGroupName
          label: 座驾相册 · 分类（分组）
          value: ""
          options:
            - label: 不限定
              value: ""
          help: 座驾相册专用的「分类」：与人员大头贴相互独立，可分别设置。座驾相册「从附件库选择」默认只显示该分类，上传的车辆照片也会存入该分类。
        - $formkit: select
          name: carPolicyName
          label: 座驾相册 · 存储策略
          value: ""
          options:
            - label: 默认策略
              value: ""
          help: 座驾相册专用的「存储策略」：与人员大头贴相互独立。留空使用默认策略。
        - $formkit: checkbox
          name: compressUpload
          label: 上传前自动压缩
          value: true
          help: 开启后，超过 1.5MB 的图片（手机直出照片常见 5–10MB）会先在浏览器里压缩到下面的最大宽度再上传：省流量、上传更快，前台加载也更快。关闭则原图上传。
        - $formkit: number
          name: compressMaxWidth
          label: 压缩最大宽度（像素）
          value: 1920
          min: 640
          max: 4096
          help: 压缩后的最大宽度（高度按比例），1920 适合博客正文与相册；要求原图质量时可填 2560 或更高。
        - $formkit: number
          name: thumbWidth
          label: 列表缩略图宽度（像素）
          value: 480
          min: 120
          max: 1600
          help: 后台列表、相册网格与前台卡片使用带 width 参数的缩略图（仅对本站 /upload 附件生效），点开查看时仍用原图。填 0 表示始终加载原图。
    - group: car
      label: 座驾设置
      formSchema:
        - $formkit: checkbox
          name: carEventsEnabled
          label: 座驾到期参与提醒
          value: true
          help: 开启后，车辆的保险、年检、保养、车船税等到期事项会与重要日期一起出现在仪表盘小组件、横幅与悬浮弹窗中。
        - $formkit: number
          name: carDefaultRemindDays
          label: 座驾默认提前提醒天数
          value: 15
          min: 0
          help: 车辆到期项的默认提前提醒天数（每个项目可单独覆盖）。
        - $formkit: checkbox
          name: carFrontendSection
          label: 前台显示「爱车」视图
          value: true
          help: 开启后，前台页面顶部会出现「生活 / 爱车」切换；关闭则只显示生活视图。
        - $formkit: checkbox
          name: carSkinEnabled
          label: 性别统一徽章风格
          value: true
          help: 座驾卡片与其车主/驾驶人使用统一徽章：男生「酷」、女生「可爱」、未关联则中性。
        - $formkit: text
          name: inspectionNodes
          label: 年检节点（年，逗号分隔）
          value: "2,4,6,10"
          help: 按当地规则调整年检节点：默认「2,4,6,10」= 非营运小微型载客汽车规则（第 2、4 年免检申领；第 6、10 年上线检验）。仅对非摩托车生效；摩托车与电瓶车/自行车仍走内置规则。填错或留空会回退默认。
        - $formkit: number
          name: inspectionYearlyFrom
          label: 从第几年起每年上线检验
          value: 11
          min: 2
          max: 30
          help: 默认第 11 年起每年上线检验（与上面的节点共同构成完整规则）；当地规则不同时按车管所要求调整。
