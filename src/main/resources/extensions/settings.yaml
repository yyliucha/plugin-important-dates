apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-important-dates-settings
spec:
  forms:
    - group: reminder
      label: 提醒设置
      formSchema:
        - $formkit: number
          name: remindDays
          label: 提前提醒天数
          value: 3
          validation: required|Number
          help: 距到期 N 天内显示提醒（含当天，0 表示仅当天提醒）
        - $formkit: checkbox
          name: backendReminder
          label: 后台提醒
          value: true
          help: 在后台「重要日期」页面顶部显示到期提醒
        - $formkit: checkbox
          name: frontendReminder
          label: 前台提醒
          value: true
          help: 在前台 /important-dates 页面顶部显示到期提醒
        - $formkit: number
          name: toastCloseSeconds
          label: 悬浮提示自动关闭秒数
          value: 8
          validation: required|Number
          help: 全站悬浮提醒自动关闭时间（秒），0 = 不自动关闭（需手动点 ×）
    - group: toast
      label: 全站悬浮提醒
      formSchema:
        - $formkit: checkbox
          name: toastEnabled
          label: 启用
          value: false
          help: 开启后插件自动在站点「系统设置 → 代码注入 → 全局 head 标签」维护一段脚本（只增删自己的片段，不影响其他注入内容；与主题无关、任何主题都会生效）：访客访问任意页面时浮出重要日期提醒，点 × 后本次会话不再弹出；关闭后自动移除该脚本。
        - $formkit: select
          name: toastPosition
          label: 弹窗位置
          value: bottom-right
          options:
            - label: 右下角
              value: bottom-right
            - label: 左下角
              value: bottom-left
            - label: 右上角
              value: top-right
            - label: 左上角
              value: top-left
            - label: 底部居中
              value: bottom-center
          help: 电脑端按所选位置固定显示；移动端固定显示在底部居中
        - $formkit: text
          name: toastTitle
          label: 提醒标题
          value: 重要日期提醒
          help: 弹窗标题文字
        - $formkit: textarea
          name: toastTemplate
          label: 提醒模板
          value: 「{title}」还有 {daysUntil} 天（{dateText}）
          help: 每条提醒的显示模板，可用占位符：{title} 名称、{daysUntil} 剩余天数、{dateText} 日期文本、{nextSolarDate} 下一次阳历日期
        - $formkit: text
          name: toastEmptyText
          label: 无提醒时文案
          value: 最近没有重要日期提醒
          help: 没有到期提醒时弹窗显示的文案；留空则无提醒时不弹出
    - group: basic
      label: 展示设置
      formSchema:
        - $formkit: checkbox
          name: showImportantTag
          label: 前台显示"重要"标记
          value: true
          help: 在 /important-dates 页面为重要日期显示"重要"标记
        - $formkit: checkbox
          name: useThemeTemplate
          label: 使用主题模板渲染
          value: true
          help: 推荐开启（默认）。插件启动时会自动为当前主题生成适配模板（themes/主题名/templates/important-dates.html），页面将在主题布局内打开；若主题无布局或模板异常，将自动回退到插件自带页面（不会报 500）。取消勾选则始终使用插件自带页面。
    - group: privacy
      label: 隐私设置
      formSchema:
        - $formkit: checkbox
          name: showBirthday
          label: 前台展示生日
          value: false
          help: 默认关闭：前台（/important-dates 页面、主题模板、数据接口）中人员生日一律脱敏显示（如 1999-10-** / 腊月**）；开启后前台展示完整生日。后台管理端始终显示完整信息，不受影响。
