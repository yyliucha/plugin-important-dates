<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">重要日期</title>
    <style>
        :root {
            --id-text: #1f2937;
            --id-muted: #6b7280;
            --id-border: #e5e7eb;
            --id-primary: #4f7cff;
            --id-bg: #f9fafb;
        }

        body {
            margin: 0;
            background: var(--id-bg);
            color: var(--id-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
        }

        .id-wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        .id-heading {
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0 4px;
        }

        .id-sub {
            color: var(--id-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .id-section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 28px 0 12px;
            padding-left: 10px;
            border-left: 4px solid var(--id-primary);
        }

        .id-card {
            background: #fff;
            border: 1px solid var(--id-border);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
        }

        .id-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .id-name {
            font-weight: 600;
            font-size: 16px;
        }

        .id-meta {
            color: var(--id-muted);
            font-size: 13px;
        }

        .id-days {
            color: var(--id-primary);
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        .id-tag {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 999px;
            padding: 1px 10px;
            font-size: 12px;
            margin-left: 6px;
        }

        .id-badge {
            display: inline-block;
            background: #fef3c7;
            color: #b45309;
            border-radius: 999px;
            padding: 1px 10px;
            font-size: 12px;
            margin-left: 8px;
            font-weight: 500;
        }

        .id-remind {
            background: #fff7ed;
            border: 1px solid #fdba74;
            border-radius: 12px;
            padding: 12px 18px;
            margin-bottom: 16px;
        }

        .id-remind-item {
            color: #9a3412;
            font-size: 14px;
            line-height: 1.9;
        }

        .id-remind-item::before {
            content: "★ ";
            color: #f59e0b;
        }

        .id-empty {
            color: var(--id-muted);
            text-align: center;
            padding: 40px 0;
        }

        .id-people-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }
    </style>
</head>
<body>
<div class="id-wrap">
    <h1 class="id-heading" th:text="${title}">重要日期</h1>
    <p class="id-sub">记录值得纪念的日子，以及身边重要的人。</p>

    <!-- 到期提醒 -->
    <div class="id-remind" th:if="${reminders != null && !reminders.isEmpty()}">
        <div class="id-remind-item" th:each="r : ${reminders}"><th:block th:if="${r.daysUntil <= 0}">今天是「</th:block><th:block th:if="${r.daysUntil == 1}">明天是「</th:block><th:block th:if="${r.daysUntil > 1}">还有 <span th:text="${r.daysUntil}">3</span> 天是「</th:block><span th:text="${r.title}">结婚纪念日</span>」</div>
    </div>

    <!-- 重要日期 -->
    <h2 class="id-section-title">重要日期</h2>
    <div class="id-card id-empty" th:if="${#lists.isEmpty(dates)}">还没有记录重要日期。</div>
    <div class="id-card" th:each="d : ${dates}">
        <div class="id-row">
            <div>
                <span class="id-name" th:text="${d.title}">结婚纪念日</span>
                <span class="id-badge" th:if="${showImportantTag && d.important}">重要</span>
                <div class="id-meta">
                    <span th:text="${d.dateText}">2019-05-20</span>
                    <span class="id-tag" th:if="${d.dateType == 'LUNAR'}">农历</span>
                    <span th:if="${d.personNames != null && !d.personNames.isEmpty()}">
                        · <span th:each="p : ${d.personNames}" th:text="${p}" th:separator="、">张三</span>
                    </span>
                </div>
            </div>
            <div class="id-days">
                <span th:text="${d.nextSolarDate}">2026-05-20</span>
                <span th:text="' · 还有 ' + ${d.daysUntil} + ' 天'"> · 还有 265 天</span>
            </div>
        </div>
    </div>

    <!-- 人员 -->
    <h2 class="id-section-title">重要的人</h2>
    <div class="id-card id-empty" th:if="${#lists.isEmpty(people)}">还没有添加人员。</div>
    <div class="id-people-grid" th:unless="${#lists.isEmpty(people)}">
        <div class="id-card" th:each="p : ${people}">
            <div class="id-row">
                <span class="id-name" th:text="${p.displayName}">张三</span>
                <span class="id-days" th:if="${p.daysUntil >= 0}"
                    th:text="'还有 ' + ${p.daysUntil} + ' 天'">还有 32 天</span>
            </div>
            <div class="id-meta">
                <span th:if="${p.nickname != null && !p.nickname.isBlank()}"
                    th:text="'昵称：' + ${p.nickname}">昵称：三哥</span>
                <span th:if="${p.relation != null && !p.relation.isBlank()}"
                    th:text="'　' + ${p.relation}">　朋友</span>
            </div>
            <div class="id-meta">
                <span th:text="'生日：' + ${p.birthdayText}">生日：六月初六</span>
                <span th:if="${p.nextSolarDate != null}" th:text="'（' + ${p.nextSolarDate} + '）'">（2025-07-25）</span>
            </div>
        </div>
    </div>

    <p class="id-sub" style="margin-top: 32px; text-align: center;">本页面由「重要日期」插件提供</p>
</div>
</body>
</html>
