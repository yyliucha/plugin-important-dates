plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.6.2"
}

group 'com.yyliucha.importantdates'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.20.20')
    compileOnly 'run.halo.app:api'
    implementation 'cn.6tail:lunar:1.7.7'
}

java {
    // 使用当前 JDK（23）编译，目标字节码 Java 17，兼容 Java 17/21 的 Halo 运行环境
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

// 构建后台管理界面（前端），依赖 Node.js/npm 环境。
// 官方 2.26 UI 构建流：@halo-dev/ui-plugin-bundler-kit 2.26（format=auto → ESM provider），
// 产物 console/build/dist/* + ui-plugin.json，由下方 processUiResources 复制进 jar 的 console/ 目录。
tasks.register('cleanFrontendDist', Delete) {
    group = 'build'
    description = 'Remove stale console UI build output (避免旧产物被打进 jar)'
    delete layout.projectDirectory.dir('console/build/dist')
}

tasks.register('buildFrontend', Exec) {
    group = 'build'
    description = 'Build the console UI (npm ci + vite build)'
    def isWin = org.gradle.internal.os.OperatingSystem.current().isWindows()
    if (isWin) {
        // 本机：nvm 路径或系统 PATH 中的 npm
        def npmCmd = System.getenv("NPM_CMD") ?: "npm"
        workingDir file("console")
        commandLine npmCmd, 'run', 'build'
    } else {
        // CI (Linux)：通过登录 shell 执行，确保 actions/setup-node 注入的 node/npm 在 PATH 中；
        // 锁文件在 Windows 生成，npm 的可选平台依赖可能缺失，补装 linux-x64 原生 rollup（--no-save 不写锁文件）
        workingDir layout.projectDirectory.asFile
        commandLine 'bash', '-lc', 'cd console && npm ci && npm install @rollup/rollup-linux-x64-gnu --no-save && npm run build'
    }
    dependsOn tasks.named('cleanFrontendDist')
    inputs.dir(layout.projectDirectory.dir('console/src'))
    inputs.files(fileTree(
        dir: layout.projectDirectory.dir('console'),
        includes: ['package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig.json']
    ))
    outputs.dir(layout.projectDirectory.dir('console/build/dist'))
}

// Sync（而非 Copy）：镜像式复制，自动删除上一次构建遗留的旧 hash 产物，避免 jar 内出现多份前端包
tasks.register('processUiResources', Sync) {
    from layout.projectDirectory.dir('console/build/dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn tasks.named('buildFrontend')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

halo {
    version = '2.26.0'
}





